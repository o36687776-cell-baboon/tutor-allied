<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Button Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Video Button Functionality Test</h1>
        <p>This page tests if the video buttons are working properly.</p>

        <div class="row">
            <div class="col-md-6">
                <h3>Tutor Controls</h3>
                <div class="d-flex gap-2 mb-3">
                    <button id="startSessionBtn" class="btn btn-success">
                        <i class="fas fa-play me-1"></i>Start Session
                    </button>
                    <button id="endSessionBtn" class="btn btn-danger" disabled>
                        <i class="fas fa-stop me-1"></i>End Session
                    </button>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <button id="muteBtn" class="btn btn-info">
                        <i class="fas fa-microphone me-1"></i>Mute
                    </button>
                    <button id="videoBtn" class="btn btn-primary">
                        <i class="fas fa-video me-1"></i>Video
                    </button>
                    <button id="shareScreenBtn" class="btn btn-warning">
                        <i class="fas fa-desktop me-1"></i>Share Screen
                    </button>
                </div>

                <div class="d-flex gap-2">
                    <button id="publishTutorialBtn" class="btn btn-outline-info">
                        <i class="fas fa-upload me-1"></i>Publish Tutorial
                    </button>
                    <button id="shareRecordingBtn" class="btn btn-outline-success">
                        <i class="fas fa-share me-1"></i>Share Recording
                    </button>
                    <button id="sessionSettingsBtn" class="btn btn-outline-secondary">
                        <i class="fas fa-sliders-h me-1"></i>Settings
                    </button>
                </div>
            </div>

            <div class="col-md-6">
                <h3>Learner Controls</h3>
                <div class="d-flex gap-2 mb-3">
                    <button id="joinSessionBtn" class="btn btn-success">
                        <i class="fas fa-sign-in-alt me-1"></i>Join Session
                    </button>
                    <button id="leaveSessionBtn" class="btn btn-danger" disabled>
                        <i class="fas fa-sign-out-alt me-1"></i>Leave Session
                    </button>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <button id="learnerMuteBtn" class="btn btn-info">
                        <i class="fas fa-microphone me-1"></i>Mute
                    </button>
                    <button id="learnerVideoBtn" class="btn btn-primary">
                        <i class="fas fa-video me-1"></i>Video
                    </button>
                    <button id="raiseHandBtn" class="btn btn-warning">
                        <i class="fas fa-hand-paper me-1"></i>Raise Hand
                    </button>
                </div>

                <div class="d-flex gap-2">
                    <button id="downloadMaterialsBtn" class="btn btn-outline-info">
                        <i class="fas fa-download me-1"></i>Download Materials
                    </button>
                    <button id="viewSlidesBtn" class="btn btn-outline-success">
                        <i class="fas fa-file-pdf me-1"></i>View Slides
                    </button>
                    <button id="askQuestionBtn" class="btn btn-outline-warning">
                        <i class="fas fa-question-circle me-1"></i>Ask Question
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h4>Console Output:</h4>
            <div id="consoleOutput" class="bg-dark text-light p-3 rounded" style="height: 200px; overflow-y: auto; font-family: monospace;">
                Button test initialized...<br>
            </div>
        </div>
    </div>

    <script>
        // Console logging function
        function log(message) {
            const consoleDiv = document.getElementById('consoleOutput');
            const timestamp = new Date().toLocaleTimeString();
            consoleDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            console.log(message);
        }

        // Tutor button handlers
        document.getElementById('startSessionBtn').addEventListener('click', function() {
            log('✅ Start Session button clicked');
            this.disabled = true;
            document.getElementById('endSessionBtn').disabled = false;
        });

        document.getElementById('endSessionBtn').addEventListener('click', function() {
            log('✅ End Session button clicked');
            this.disabled = true;
            document.getElementById('startSessionBtn').disabled = false;
        });

        document.getElementById('muteBtn').addEventListener('click', function() {
            log('✅ Mute button clicked');
            const icon = this.querySelector('i');
            if (icon.classList.contains('fa-microphone')) {
                icon.classList.remove('fa-microphone');
                icon.classList.add('fa-microphone-slash');
                this.classList.remove('btn-info');
                this.classList.add('btn-danger');
            } else {
                icon.classList.remove('fa-microphone-slash');
                icon.classList.add('fa-microphone');
                this.classList.remove('btn-danger');
                this.classList.add('btn-info');
            }
        });

        document.getElementById('videoBtn').addEventListener('click', function() {
            log('✅ Video button clicked');
            const icon = this.querySelector('i');
            if (icon.classList.contains('fa-video')) {
                icon.classList.remove('fa-video');
                icon.classList.add('fa-video-slash');
                this.classList.remove('btn-primary');
                this.classList.add('btn-secondary');
            } else {
                icon.classList.remove('fa-video-slash');
                icon.classList.add('fa-video');
                this.classList.remove('btn-secondary');
                this.classList.add('btn-primary');
            }
        });

        document.getElementById('shareScreenBtn').addEventListener('click', function() {
            log('✅ Share Screen button clicked');
            alert('Screen sharing feature would be implemented here');
        });

        document.getElementById('publishTutorialBtn').addEventListener('click', function() {
            log('✅ Publish Tutorial button clicked');
            alert('Tutorial publishing feature would be implemented here');
        });

        document.getElementById('shareRecordingBtn').addEventListener('click', function() {
            log('✅ Share Recording button clicked');
            alert('Recording sharing feature would be implemented here');
        });

        document.getElementById('sessionSettingsBtn').addEventListener('click', function() {
            log('✅ Session Settings button clicked');
            alert('Session settings modal would open here');
        });

        // Learner button handlers
        document.getElementById('joinSessionBtn').addEventListener('click', function() {
            log('✅ Join Session button clicked');
            this.disabled = true;
            document.getElementById('leaveSessionBtn').disabled = false;
        });

        document.getElementById('leaveSessionBtn').addEventListener('click', function() {
            log('✅ Leave Session button clicked');
            this.disabled = true;
            document.getElementById('joinSessionBtn').disabled = false;
        });

        document.getElementById('learnerMuteBtn').addEventListener('click', function() {
            log('✅ Learner Mute button clicked');
            const icon = this.querySelector('i');
            if (icon.classList.contains('fa-microphone')) {
                icon.classList.remove('fa-microphone');
                icon.classList.add('fa-microphone-slash');
                this.classList.remove('btn-info');
                this.classList.add('btn-danger');
            } else {
                icon.classList.remove('fa-microphone-slash');
                icon.classList.add('fa-microphone');
                this.classList.remove('btn-danger');
                this.classList.add('btn-info');
            }
        });

        document.getElementById('learnerVideoBtn').addEventListener('click', function() {
            log('✅ Learner Video button clicked');
            const icon = this.querySelector('i');
            if (icon.classList.contains('fa-video')) {
                icon.classList.remove('fa-video');
                icon.classList.add('fa-video-slash');
                this.classList.remove('btn-primary');
                this.classList.add('btn-secondary');
            } else {
                icon.classList.remove('fa-video-slash');
                icon.classList.add('fa-video');
                this.classList.remove('btn-secondary');
                this.classList.add('btn-primary');
            }
        });

        document.getElementById('raiseHandBtn').addEventListener('click', function() {
            log('✅ Raise Hand button clicked');
            const icon = this.querySelector('i');
            if (icon.classList.contains('fa-hand-paper')) {
                this.classList.remove('btn-warning');
                this.classList.add('btn-outline-warning');
                log('Hand lowered');
            } else {
                this.classList.remove('btn-outline-warning');
                this.classList.add('btn-warning');
                log('Hand raised');
            }
        });

        document.getElementById('downloadMaterialsBtn').addEventListener('click', function() {
            log('✅ Download Materials button clicked');
            alert('Download materials feature would be implemented here');
        });

        document.getElementById('viewSlidesBtn').addEventListener('click', function() {
            log('✅ View Slides button clicked');
            alert('Slides viewer would open here');
        });

        document.getElementById('askQuestionBtn').addEventListener('click', function() {
            log('✅ Ask Question button clicked');
            alert('Question input would be focused here');
        });

        // Initialize test
        log('🎥 Video button test page loaded successfully');
        log('All buttons should now be functional!');
    </script>
</body>
</html>
