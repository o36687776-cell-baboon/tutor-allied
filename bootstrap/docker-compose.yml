version: '3.8'  
services:  
"  mysql:"  
"    image: mysql:8.0"  
"    environment:"  
"      MYSQL_ROOT_PASSWORD: root_placeholder"  
"      MYSQL_DATABASE: pi_bootstrap"  
"      MYSQL_USER: pi_boot_user"  
"      MYSQL_PASSWORD: secure_password_here"  
"    volumes:"  
"      - db_data:/var/lib/mysql"  
"    ports:"  
"      - \"3307:3306\""  
"  phpmyadmin:"  
"    image: phpmyadmin/phpmyadmin"  
"    environment:"  
"      PMA_HOST: mysql"  
"      UPLOAD_LIMIT: 64M"  
"    ports:"  
"      - \"8081:80\""  
"    depends_on:"  
"      - mysql"  
"  webhook:"  
"    image: node:20-alpine"  
"    working_dir: /app"  
"    volumes:"  
"      - ./webhook:/app"  
"    command: [\"node\",\"server.js\"]"  
"    ports:"  
"      - \"4001:4001\""  
volumes:  
"  db_data:" 
